name: Deploy frontend to GitHub Pages

# Static frontend only — this project has no backend. The build output in dist/ is
# the whole application; all inference runs in the visitor's browser.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue rather than cancel, so a push that lands
# mid-deploy still ends up published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # The verification suites gate the deploy. A red suite should not reach a
      # public URL, and these are the only automated check this project has.
      - name: Verify
        run: npm run verify

      - name: Build
        run: npm run build

      # enablement lets this turn Pages on via the API using the workflow token,
      # instead of needing someone to flip Settings -> Pages -> Source by hand.
      # Requires the pages: write permission granted above.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
